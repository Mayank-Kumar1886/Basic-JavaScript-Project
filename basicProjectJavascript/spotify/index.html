<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Spotify-Play your favourite music</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Ubuntu:wght@300;400&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Ubuntu:wght@300;400&family=Varela+Round&display=swap");
      body {
        background-color: antiquewhite;
      }
      * {
        margin: 0;
        padding: 0;
      }
      nav {
        font-family: "Ubuntu", sans-serif;
      }
      nav ul {
        display: flex;
        align-items: center;
        list-style: none;
        height: 70px;
        background-color: rgb(0, 0, 0);
        color: white;
      }
      nav ul li {
        padding: 0 12px;
      }
      .brand img {
        width: 50px;
        padding: 0 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        font-weight: bolder;
        font-size: 1.3rem;
      }
      .container {
        min-height: 70vh;
        background-color: black;
        color: white;
        font-family: "Varela Round", sans-serif;
        display: flex;
        width: 70%;
        margin: 23px auto;
        border-radius: 12px;
        padding: 34px;
        background-image: url("bg.jpg");
      }
      .bottom {
        position: sticky;
        height: 100px;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
      }
      .icons {
        margin-top: 14px;
      }
      .icons i {
        cursor: pointer;
      }
      #myProgressBar {
        width: 80vw;
        cursor: pointer;
      }
      .songItemContainer {
        margin-top: 80px;
      }
      .songItem {
        height: 50px;
        display: flex;
        background-color: rgb(150, 150, 150);
        color: black;
        margin: 12px 0;
        justify-content: space-between;
        align-items: center;
        border-radius: 35px;
        font-size: 23px;
      }
      .songItem img {
        width: 40px;
        margin: 0 23px;
        border-radius: 34px;
      }
      .timeStamp {
        margin: 0 23px;
      }
      .timeStamp i {
        cursor: pointer;
      }
      .songInfo {
        position: absolute;
        left: 10vw;
        font-family: "Varela Round", sans-serif;
      }
      .songInfo img {
        width: 40px;
        opacity: 0;
        transition: opacity 0.8s ease-in;
      }
    </style>
  </head>

    <div class="bottom">
      <input
        type="range"
        name="range"
        id="myProgressBar"
        min="0"
        value="0"
        max="100"
      />
      <div class="icons">
        <i class="fas fa-3x fa-step-backward" id="previous"></i>
        <i class="far fa-3x fa-play-circle" id="masterPlay"></i>
        <i class="fas fa-3x fa-step-forward" id="next"></i>

      <div class="songInfo">

    <script src="script.js"></script>
    <script
      src="https://kit.fontawesome.com/26504e4a1f.js"
      crossorigin="anonymous"
    ></script>
    <script>
      console.log("Welcome to spotify");
      //Initialize the variables
      let songIndex = 0;
      let audioElement = new Audio("songs/1.mp3");
      let masterPlay = document.getElementById("masterPlay");
      let myProgressBar = document.getElementById("myProgressBar");
      let gif = document.getElementById("gif");
      let masterSongName = document.getElementById("masterSongName");
      let songItems = Array.from(document.getElementsByClassName("songItem"));
      let songs = [
        {
          songName: "Let me love you",
          filePath: "songs/1.mp3",
          coverPath: "covers/1.jpg",
        },
        {
          songName: "Hi",
          filePath: "songs/2.mp3",
          coverPath: "covers/2.jpg",
        },
        {
          songName: "Let me love you",
          filePath: "songs/3.mp3",
          coverPath: "covers/3.jpg",
        },
        {
          songName: "Hello",
          filePath: "songs/4.mp3",
          coverPath: "covers/4.jpg",
        },
        {
          songName: "Let me love you",
          filePath: "songs/5.mp3",
          coverPath: "covers/5.jpg",
        },
        {
          songName: "Let me love you",
          filePath: "songs/6.mp3",
          coverPath: "covers/6.jpg",
        },
        {
          songName: "Let me love you",
          filePath: "songs/7.mp3",
          coverPath: "covers/7.jpg",
        },
        {
          songName: "Let me love you",
          filePath: "songs/8.mp3",
          coverPath: "covers/8.jpg",
        },
        {
          songName: "Let me love you",
          filePath: "songs/9.mp3",
          coverPath: "covers/9.jpg",
        },
        {
          songName: "Let me love you",
          filePath: "songs/10.mp3",
          coverPath: "covers/10.jpg",
        },
      ];
      songItems.forEach((element, i) => {
        element.getElementsByTagName("img")[0].src = songs[i].coverPath;
        element.getElementsByClassName("songName")[0].innerText =
          songs[i].songName;
      });
      //Handle play/pause click
      masterPlay.addEventListener("click", () => {
        if (audioElement.paused || audioElement.currentTime <= 0) {
          audioElement.play();
          masterPlay.classList.remove("fa-play-circle");
          masterPlay.classList.add("fa-pause-circle");
          gif.style.opacity = 1;
        } else {
          audioElement.pause();
          masterPlay.classList.remove("fa-pause-circle");
          masterPlay.classList.add("fa-play-circle");
          gif.style.opacity = 0;
        }
      });
      //Listen to events
      audioElement.addEventListener("timeupdate", () => {
        progress = parseInt(
          (audioElement.currentTime / audioElement.duration) * 100
        );
        myProgressBar.value = progress;
      });
      myProgressBar.addEventListener("change", () => {
        audioElement.currentTime =
          (myProgressBar.value * audioElement.duration) / 100;
      });
      const makeAllPlays = () => {
        Array.from(document.getElementsByClassName("songItemPlay")).forEach(
          (element) => {
            element.classList.remove("fa-pause-circle");
            element.classList.add("fa-play-circle");
          }
        );
      };
      Array.from(document.getElementsByClassName("songItemPlay")).forEach(
        (element) => {
          element.addEventListener("click", (event) => {
            console.log(event.target);
            makeAllPlays();
            songIndex = parseInt(event.target.id);
            event.target.classList.remove("fa-play-circle");
            event.target.classList.add("fa-pause-circle");
            audioElement.src = `songs/${songIndex + 1}.mp3`;

            masterSongName.innerHTML = songs[songIndex-1].songName;
            audioElement.currentTime = 0;
            audioElement.play();
            masterPlay.classList.add("fa-pause-circle");
            masterPlay.classList.remove("fa-play-circle");
          });
        }
      );
      document.getElementById("next").addEventListener("click", () => {
        if (songIndex > 9) {
          songIndex = 0;
        } else {
          songIndex += 1;
        } 
        audioElement.src = `songs/${songIndex + 1}.mp3`;
        masterSongName.innerHTML = songs[songIndex-1].songName;
        audioElement.currentTime = 0;
        audioElement.play();
        masterPlay.classList.add("fa-pause-circle");
        masterPlay.classList.remove("fa-play-circle");
      });
      document.getElementById("previous").addEventListener("click", () => {
        if (songIndex < 0) {
          songIndex = 0;
        } else {
          songIndex -= 1;
        }
        audioElement.src = `songs/${songIndex + 1}.mp3`;
        masterSongName.innerHTML = songs[songIndex-1].songName;
        audioElement.currentTime = 0;
        audioElement.play();
        masterPlay.classList.add("fa-pause-circle");
        masterPlay.classList.remove("fa-play-circle");
      });
    </script>
