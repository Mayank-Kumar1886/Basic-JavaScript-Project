<!DOCTYPE html>
<htbuttonml lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Send Mail for request</title>
  </head>
  <body>
    <div class="container">
      <h1>Fill Details</h1>
      <div class="inputs">
        <input type="text" placeholder="Enter your First Name" />
        <span></span>
        <input type="text" placeholder="Enter your Last Name" />
        <input type="email" placeholder="Enter your E-Mail Name" />
        <button class="button" role="button"><span class="text">Submit</span></button>
      </div>
    </div>
  </body>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .container {
      width: 35rem;
      height: 25rem;
      background-color: #0b4e58;
      margin-top: 10rem;
      margin-left: 40rem;
      border-radius: 10px;
    }
    .container h1 {
      font-size: 40px;
      font-family: "Courier New", Courier, monospace;
      font-weight: 900;
      margin: 0px 60px;
      padding-top: 15px;
      display: flex;
      justify-content: center;
    }
    .inputs {
      display: grid;
      gap: 25px;
      margin: 20px 0;
      justify-content: center;
    }
    input {
      width: 20rem;
      font-size: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
    }
    .button {
        align-items: center;
        background-image: linear-gradient(144deg,#AF40FF, #5B42F3 50%,#00DDEB);
        border: 0;
        border-radius: 8px;
        box-shadow: rgba(151, 65, 252, 0.2) 0 15px 30px -5px;
        box-sizing: border-box;
        color: #FFFFFF;
        display: flex;
        font-family: Phantomsans, sans-serif;
        font-size: 20px;
        justify-content: center;
        line-height: 1em;
        max-width: 100%;
        min-width: 140px;
        padding: 3px;
        text-decoration: none;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        white-space: nowrap;
        cursor: pointer;
      }
      
      .button:active,
      .button:hover {
        outline: 0;
      }
      
      .button span {
        background-color: rgb(5, 6, 45);
        padding: 16px 24px;
        border-radius: 6px;
        width: 100%;
        height: 100%;
        transition: 300ms;
      }
      
      .button:hover span {
        background: none;
      }
      
  </style>
</html>
