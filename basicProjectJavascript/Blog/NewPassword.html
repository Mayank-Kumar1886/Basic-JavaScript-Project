<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Password</title>
  </head>
  <body>
    <div class="container">
      <h1>Enter your password</h1>
      <div class="inputs">
        <input
          type="password"
          id="LastPassword"
          placeholder="Enter your last password"
        />
        <span id="LastPasswordError"></span>
        <input
          type="password"
          id="NewPassword"
          placeholder="Enter your new password"
        />
        <span id="NewPasswordError"></span>
        <input
          type="password"
          id="ConfirmNewPassword"
          placeholder="Enter your new Confirm password"
        />
        <span id="ConfirmNewPasswordError"></span>

        <button class="button" role="button" onclick="changePassword()">
          <span class="text">Submit</span>
        </button>
      </div>
    </div>
  </body>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .container {
      width: 35rem;
      height: 33rem;
      background-color: #0b4e58;
      margin-top: 10rem;
      margin-left: 40rem;
      border-radius: 10px;
    }
    .container h1 {
      font-size: 35px;
      font-family: "Courier New", Courier, monospace;
      font-weight: 900;
      margin: 0px 60px;
      padding-top: 15px;
      display: flex;
      justify-content: center;
      color: #fff;
    }
    .inputs {
      display: grid;
      gap: 25px;
      margin: 20px 0;
      justify-content: center;
    }
    input {
      width: 20rem;
      font-size: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
    }
    .button {
      align-items: center;
      background-image: linear-gradient(144deg, #af40ff, #5b42f3 50%, #00ddeb);
      border: 0;
      border-radius: 8px;
      box-shadow: rgba(151, 65, 252, 0.2) 0 15px 30px -5px;
      box-sizing: border-box;
      color: #ffffff;
      display: flex;
      font-family: Phantomsans, sans-serif;
      font-size: 20px;
      justify-content: center;
      line-height: 1em;
      max-width: 100%;
      min-width: 140px;
      padding: 3px;
      text-decoration: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      white-space: nowrap;
      cursor: pointer;
    }

    .button:active,
    .button:hover {
      outline: 0;
    }

    .button span {
      background-color: rgb(5, 6, 45);
      padding: 16px 24px;
      border-radius: 6px;
      width: 100%;
      height: 100%;
      transition: 300ms;
    }

    .button:hover span {
      background: none;
    }
  </style>
  <script>
    function isValidPassword(password) {
      // Regular expression for password validation
      const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
      return passwordRegex.test(password);
    }

    function changePassword() {
      const lastPassword = document.getElementById("LastPassword").value;
      const NewPassword = document.getElementById("NewPassword").value;
      const ConfirmNewPassword =
        document.getElementById("ConfirmNewPassword").value;

      function displayErrorMessage(elementId, message ) {
        const element = document.getElementById(elementId);
        element.innerHTML = message;
        element.style.color = "red";
        element.style.fontSize = "20px";
        element.style.margin = "0 auto";
        setTimeout (()=>{
          element.textContent =""
        },2000)
      }

      if (lastPassword == "") {
        displayErrorMessage("LastPasswordError", "**Please enter your password" );
    return;
      }
      if (!isValidPassword(lastPassword)) {
        displayErrorMessage("LastPasswordError", "**Please enter correct password" );
    return;
      }
      if (NewPassword == "") {
        displayErrorMessage("NewPasswordError", "**Please enter your password");
    return;
      }
      if (!isValidPassword(NewPassword)) {
        displayErrorMessage("NewPasswordError", "**Please enter correct password");
        return;
      }
      if (ConfirmNewPassword == "") {
        displayErrorMessage("ConfirmNewPasswordError", "**Please enter your password");
    return;
      }
      if (!isValidPassword(NewPassword)) {
        displayErrorMessage("ConfirmNewPasswordError", "**Please enter correct password");
    return;
      }
      if (NewPassword !== ConfirmNewPassword) {
        displayErrorMessage("ConfirmNewPasswordError", "**Both passwords do not match");
    return;
      }
      if (lastPassword === NewPassword) {
        displayErrorMessage("NewPasswordError", "**Password must be different from the last password");
    return;
      }
    }
  </script>
</html>
