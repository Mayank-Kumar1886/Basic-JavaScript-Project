<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Number</title>
</head>
<body>
    <div class="container">
        <h1>Phone Number</h1>
        <strong>Phone Number : </strong>
        <input type="text" name="phoneNumber" id="phoneNumber" placeholder="Enter phone number"><br>
        <button class="button" role="button" onclick="checkPhoneNumber()"><span class="text">Submit</span></button>
    </div>
</body>
<style>
    .container{
        width: 500px;
      height: 250px;
      background-image: linear-gradient(144deg,#0d0513, #0f0e11 50%,#35959c);
      border-radius: 10px;
    }
    .container h1{
        color: white;
      padding-top: 40px;
      text-align: center;
    }

    .container strong {
        font-size: large;
        color: white;
        margin-left: 5%;
        font-size: 30px;
      }
      .container input {
        font-size: 15px;
        width: 12rem;
        border: none;
        padding: 7px;
      }
      .button {
        align-items: center;
        background-image: linear-gradient(144deg,#AF40FF, #5B42F3 50%,#00DDEB);
        border: 0;
        border-radius: 8px;
        box-shadow: rgba(151, 65, 252, 0.2) 0 15px 30px -5px;
        box-sizing: border-box;
        color: #FFFFFF;
        display: flex;
        font-family: Phantomsans, sans-serif;
        font-size: 20px;
        justify-content: center;
        line-height: 1em;
        max-width: 100%;
        min-width: 140px;
        padding: 3px;
        text-decoration: none;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        white-space: nowrap;
        cursor: pointer;
        margin: 10px auto;
      }
      
      .button:active,
      .button:hover {
        outline: 0;
      }
      
      .button span {
        background-color: rgb(5, 6, 45);
        padding: 16px 24px;
        border-radius: 6px;
        width: 100%;
        height: 100%;
        transition: 300ms;
      }
      
      .button:hover span {
        background: none;
      }
      
      
</style>
<script>
    function checkPhoneNumber() {
        const phoneNumberInput = document.getElementById("phoneNumber");
        const phoneNumber = phoneNumberInput.value.trim();
        const phoneNumberRegex = /^[0-9]{10}$/; // Regex for exactly 10 digits

        if (phoneNumberRegex.test(phoneNumber)) {
            
              window.location.href = '../Blog/NewPassword.html';
            
            // You can perform further actions here, such as submitting the form.
        } else {
            alert("Invalid phone number! Please enter a 10-digit number.");
        }
    }
</script>
</html>
